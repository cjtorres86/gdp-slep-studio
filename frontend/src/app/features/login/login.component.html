<main class="fondo-institucional min-h-screen flex flex-col items-center justify-center px-4 py-10">
  <section
    class="relative z-10 w-full max-w-[440px] overflow-hidden border border-white/70"
    style="background: rgb(255 255 255 / 0.9); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%)"
    aria-labelledby="titulo-ingreso"
  >
    <div class="barra-marca" aria-hidden="true"></div>

    <div class="px-6 pt-8 pb-9 sm:px-9 flex flex-col items-center">
      <!-- 1. Logo institucional -->
      <img
        src="logo-dep.png"
        alt="Educación Pública — Ministerio de Educación"
        class="w-[224px] h-auto select-none"
        draggable="false"
      />

      <!-- 2. Nombre del sistema -->
      <div class="mt-6 text-center">
        <h1 id="titulo-ingreso" class="font-display text-[36px] leading-none font-extrabold tracking-tight text-dep-navy">
          GDP - SLEP
        </h1>
        <p class="mx-auto mt-2.5 max-w-[330px] text-balance text-[11px] leading-relaxed font-bold tracking-[0.16em] uppercase text-dep-blue">
          Gestión y Desarrollo de Personas para los SLEP
        </p>
      </div>

      <!-- 3. Acceso -->
      <div class="w-full mt-8">
        <!-- ClaveÚnica: visible desde ya, todavía sin activar. La insignia
             "Próximamente" va sobre el borde para no quitarle ancho al texto. -->
        <div class="relative mt-1">
          <button
            type="button"
            disabled
            aria-disabled="true"
            aria-label="Ingresar con ClaveÚnica (próximamente)"
            title="El ingreso con ClaveÚnica estará disponible próximamente"
            class="flex w-full items-center gap-3 rounded-xl border border-[#d5dbe8] bg-dep-gray px-4 py-3.5 text-left cursor-not-allowed"
          >
            <svg class="size-6 shrink-0 text-dep-navy/45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <circle cx="9" cy="11" r="2" />
              <path d="M6 16c.6-1.6 1.8-2.2 3-2.2s2.4.6 3 2.2M14 10h4M14 13.5h3" />
            </svg>
            <span class="leading-tight">
              <span class="block whitespace-nowrap text-[14px] font-bold text-dep-navy/60">Ingresar con ClaveÚnica</span>
              <span class="block text-[11.5px] text-slate-500">Con tu RUT y tu ClaveÚnica</span>
            </span>
          </button>
          <span class="absolute -top-2.5 right-3 rounded-full border border-[#bcd6ee] bg-white px-2.5 py-0.5 text-[9.5px] font-bold uppercase tracking-wider text-dep-blue shadow-sm" aria-hidden="true">
            Próximamente
          </span>
        </div>

        <div class="flex items-center gap-3 my-6" aria-hidden="true">
          <span class="h-px flex-1 bg-[#dfe4ee]"></span>
          <span class="text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-400">o ingresa con tu usuario</span>
          <span class="h-px flex-1 bg-[#dfe4ee]"></span>
        </div>

        <form (ngSubmit)="ingresar()" class="flex flex-col gap-4" novalidate>
          <div class="flex flex-col gap-1.5">
            <label for="usuario" class="text-[12px] font-bold text-dep-navy">Usuario</label>
            <input
              id="usuario"
              name="usuario"
              type="text"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              [(ngModel)]="usuario"
              [disabled]="enviando"
              class="w-full rounded-lg border border-[#cdd4e3] bg-white px-3.5 py-2.5 text-[14px] text-dep-navy placeholder:text-slate-400 transition focus:border-dep-blue focus:ring-2 focus:ring-dep-blue/20 focus:outline-none disabled:opacity-60"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="contrasena" class="text-[12px] font-bold text-dep-navy">Contraseña</label>
            <div class="relative">
              <input
                id="contrasena"
                name="contrasena"
                [type]="verClave ? 'text' : 'password'"
                autocomplete="current-password"
                [(ngModel)]="contrasena"
                [disabled]="enviando"
                class="w-full rounded-lg border border-[#cdd4e3] bg-white pl-3.5 pr-11 py-2.5 text-[14px] text-dep-navy transition focus:border-dep-blue focus:ring-2 focus:ring-dep-blue/20 focus:outline-none disabled:opacity-60"
              />
              <button
                type="button"
                (click)="verClave = !verClave"
                [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                class="absolute inset-y-0 right-0 grid w-11 place-items-center text-slate-400 hover:text-dep-navy cursor-pointer"
              >
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                  @if (verClave) { <path d="M3 3l18 18" /> }
                </svg>
              </button>
            </div>
          </div>

          @if (error) {
            <p role="alert" class="rounded-lg border border-[#ffc9d1] bg-[#fff1f3] px-3.5 py-2.5 text-[12.5px] font-medium leading-snug text-[#b4112b]">
              {{ error }}
            </p>
          }

          <button
            type="submit"
            [disabled]="enviando"
            class="mt-1 flex w-full items-center justify-center gap-2 rounded-lg bg-dep-navy px-4 py-3 text-[14px] font-bold tracking-wide text-white transition hover:bg-dep-blue disabled:opacity-70 disabled:cursor-wait cursor-pointer"
          >
            @if (enviando) {
              <svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.3" stroke-width="3" />
                <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
              </svg>
              Ingresando…
            } @else {
              Ingresar
            }
          </button>
        </form>
      </div>
    </div>
  </section>

  <p class="relative z-10 mt-7 text-center text-[11.5px] leading-relaxed text-white/70">
    Dirección de Educación Pública · Ministerio de Educación
  </p>
</main>
